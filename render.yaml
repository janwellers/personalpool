services:
  - type: web
    name: personalpool
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "20.18.1"
      - key: NODE_ENV
        value: production
      # Postgres (z. B. Neon oder Supabase). Ohne DATABASE_URL wird lokal eine JSON-Datei genutzt.
      - key: DATABASE_URL
        sync: false
      # Passwort für den Zugang zur App. Im Render-Dashboard eintragen.
      - key: APP_PASSWORD
        sync: false
      - key: APP_SECRET
        generateValue: true
      # Tägliche Sicherung in einen S3-kompatiblen Speicher (Cloudflare R2, Backblaze B2, AWS S3).
      # Ohne diese Werte läuft die App normal weiter, legt aber keine Sicherungen ab.
      - key: BACKUP_S3_ENDPOINT
        sync: false
      - key: BACKUP_S3_BUCKET
        sync: false
      - key: BACKUP_S3_KEY_ID
        sync: false
      - key: BACKUP_S3_SECRET
        sync: false
      - key: BACKUP_RETENTION_DAYS
        value: "30"
